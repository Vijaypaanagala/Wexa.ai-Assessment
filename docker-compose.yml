# Resource-capped local peers for fair comparison against CognoDB free tier
# (0.5 vCPU, 256 MB RAM, ~1 GB disk). Adjust if a engine cannot start at 256 MB —
# document any deviation in README.
services:
  memgraph:
    image: memgraph/memgraph:2.22.1
    ports:
      - "7687:7687"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    # Compose v2 without swarm still honors mem_limit on many setups:
    mem_limit: 256m
    cpus: 0.50

  falkordb:
    image: falkordb/falkordb:v4.8.0
    ports:
      - "6379:6379"
    mem_limit: 256m
    cpus: 0.50

  arangodb:
    image: arangodb:3.12.4
    ports:
      - "8529:8529"
    environment:
      ARANGO_ROOT_PASSWORD: ${ARANGO_PASSWORD:-benchmark}
    mem_limit: 256m
    cpus: 0.50
    volumes:
      - ./.docker-data/arangodb:/var/lib/arangodb3